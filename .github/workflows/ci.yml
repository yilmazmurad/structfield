name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Lint (php-cs-fixer)
        run: composer lint
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'

      - name: Static analysis (PHPStan, level max)
        run: composer analyse -- --no-progress

      - name: Tests (PHPUnit + httpwg conformance suite)
        run: composer test

      - name: Conformance summary
        run: php bin/conformance.php

      - name: Example
        run: php examples/real-headers.php
